
services:
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-intel
    container_name: llama
    ports:
      - "11435:8080"   # Ollama-compatible port
    volumes:
      - /home/trevor.sawyer/homelab-data/llama/models:/models
    devices:
      - /dev/dri:/dev/dri
    environment:
      - ONEAPI_DEVICE_SELECTOR=level_zero:0
      - SYCL_PI_LEVEL_ZERO_USE_IMMEDIATE_COMMANDLISTS=1
      - ZES_ENABLE_SYSMAN=1
    command: >
      --model /models/Meta-Llama-3.1-8B-Instruct-Q4_K_S.gguf
      --alias llama-3.1-8b
      --n-gpu-layers 99
      --ctx-size 4096
      --threads 4
      --batch-size 512
      --ubatch-size 128
      --mlock
      --host 0.0.0.0
      --port 8080
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui-cpp
    volumes:
      - /home/trevor.sawyer/homelab-data/llama/open-webui:/app/backend/data
    depends_on:
      - llama
    ports:
      - "3032:8080"
    environment:
      # Force env vars so OpenAI (llama.cpp) connection is used (DB may have empty connection)
      - ENABLE_PERSISTENT_CONFIG=False
      # So this instance doesn’t redirect to the other Open WebUI (3030)
      - WEBUI_URL=http://localhost:3032
      - WEBUI_NAME=Open WebUI (llama.cpp)
      # This instance uses only llama.cpp — do not fetch models from Ollama
      - ENABLE_OLLAMA_API=False
      - OPENAI_API_BASE_URLS=http://llama:8080/v1
      - OPENAI_API_KEYS=
      # Give llama.cpp time to load model before fetching list
      - AIOHTTP_CLIENT_TIMEOUT_OPENAI_MODEL_LIST=60
      - WEBUI_SECRET_KEY=24f9dae69aad42f53713e907b066b8ce3ec9c19c48fd65261748229e5b9e8bfd
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
