# recommendation — conceptual schema
# Final user-facing Council recommendation (Phase 13.1)

recommendation:
  request_id: string
  summary: string               # what to do / what choice remains
  rationale: string             # why, in plain language
  risks:
    - string
  alternatives:
    - option: string
      when_preferable: string
  next_actions:
    - string
  dimensions_considered:        # structured reasoning trace (not a scorecard)
    - dimension: enum           # strategic | feasibility | risk | historical | missing_info | human_impact | meaning_values | synthesis
      contributors:
        - enum
      note: string
  dissent:                      # material unresolved disagreement, if any
    majority_position: string
    minority_concerns:
      - string
    trade_offs:
      - string
  participants:
    - enum
  deferred:
    - enum
  confidence_overall: enum      # low | medium | high — honesty, not authority
  produced_by: KORA             # synthesizer / user-facing voice
