# Phase 10.5 services.conf — declarative migration map (mocha personal homelab)
# Format (pipe-delimited):
# key|compose_relpath|container_names|source_config|target_config|keep_hive|risk|order|migration_required|already_migrated|rsync_excludes|notes
#
# rsync_excludes: comma-separated patterns relative to source_config (applied on copy + size estimates)
# migration_required: yes|no|verify|deferred
# already_migrated: yes|no|partial
# Folder services/authentic/ keyed as authentik (correct spelling)
# ORDER: 10=low, 20=medium, 30=higher, 40=final
#
# POLICY: config → /mnt/monarch/appdata; large datasets stay on /hive
# EXCEPTION: ollama config+models → /mnt/monarch/appdata/ollama (relocatable later via this file)

code-server|services/code-server/compose.yml|code-server|/hive/code-server/config|/mnt/monarch/appdata/code-server|/hive|low|10|yes|no||Config only; keep /hive and /mnt/monarch/appdata workspace RO mounts; create services/code-server/.env before execute
homepage|services/homepage/compose.yaml|homepage|/hive/config/homepage|/mnt/monarch/appdata/homepage||low|11|yes|no||LIVE drift: container still binds /hive/config/homepage and /hive/data/homepage/images; repo compose uses PATH_* — migrate live hive paths to appdata then align compose/env
homepage-images|services/homepage/compose.yaml|homepage|/hive/data/homepage/images|/mnt/monarch/appdata/homepage/images||low|11|yes|no||Companion path for homepage images (same stack)
traefik|services/traefik/compose.yaml|traefik||/mnt/monarch/appdata/traefik||low|12|verify|partial||acme.json already under /mnt/monarch/appdata/traefik; verify-only; destination non-empty is EXPECTED
beszel|services/beszel/compose.yml|beszel||/mnt/monarch/appdata/beszel||low|13|no|yes||Already on /mnt/monarch/appdata/beszel/beszel_data
portainer|services/portainer/compose.yaml|portainer|/hive/portainer|/mnt/monarch/appdata/portainer||low|14|yes|no|compose/49,compose/50|Small Portainer /data tree; root-owned compose/49 and compose/50 may be unreadable — stats warn, copy may need sudo or exclude
authentik|services/authentic/compose.yaml|authentik-db,authentik-redis,authentik-server,authentik-worker||/mnt/monarch/appdata/authentik||medium|20|verify|partial||PATH_DATA/authentik/* in compose; live dirs may be absent if stack not deployed from this repo yet
honcho|services/honcho/compose.yml|honcho-api,honcho-deriver,honcho-postgres,honcho-redis||/mnt/monarch/appdata/honcho||medium|21|no|yes||postgres+redis already on appdata
hermes|services/hermes/compose.yml|hermes||/mnt/monarch/appdata/hermes||medium|22|no|yes||Already on appdata
n8n|services/n8n/compose.yml|n8n||/mnt/monarch/appdata/n8n||medium|23|no|yes||Already on appdata
open-webui|services/ollama/compose.yml|open-webui||/mnt/monarch/appdata/open-webui||medium|24|no|yes||Shares compose with ollama; already on appdata
ollama|services/ollama/compose.yml|ollama|/hive/ollama|/mnt/monarch/appdata/ollama||higher|30|yes|no||INTENTIONAL EXCEPTION: migrate config+models (~8B max today). Relocate later by swapping source/target in this file. Needs services/ollama/.env before execute
calibre|services/calibre-web/compose.yml|calibre|/hive/calibre/config|/mnt/monarch/appdata/calibre|/hive/library|higher|31|yes|no||Books stay on /hive/library
calibre-web|services/calibre-web/compose.yml|calibre-web|/hive/calibre-web/config|/mnt/monarch/appdata/calibre-web|/hive/library|higher|32|yes|no||Books stay on /hive/library
jellyfin|services/jellyfin/compose.yml|jellyfin|/hive/jellyfin/config|/mnt/monarch/appdata/jellyfin|/hive/jellyfin/tv,/hive/jellyfin/movie|final|40|yes|no||Config only; media stays on /hive; may need .env for compose config
nzbget|services/NZBget/compose.yml|nzbget|/hive/NZBget/config|/mnt/monarch/appdata/nzbget|/hive/downloads,/hive/NZBget/config/downloads|final|41|yes|no|downloads/**,*.log,nzbget.log|IMPORTANT: nested config/downloads (~110G) and huge nzbget.log must NOT move to SSD — excluded from rsync; keep_hive lists nested downloads
hotio|services/Hotio/compose.yml|qbittorrent|/hive/Hotio/config|/mnt/monarch/appdata/hotio|/hive/downloads/completed|final|42|yes|no||Config only; downloads stay
beszel-agent|services/beszel_agent/compose.yml|beszel-agent|||./beszel_agent_data|low|15|deferred|no||Relative path; host docker.sock — classify before migrate
echoos|services/EchoOS/compose.yaml|logseq-web|/hive/echoos||/hive/echoos|higher|35|deferred|no||Graph data on /hive; classify before any move
cosmoos|services/CosmoOS/compose.yaml|cosmos-server|||/var/lib/cosmos|higher|36|no|n/a||Host /var/lib/cosmos + whole-root mount — out of /hive→appdata scope
