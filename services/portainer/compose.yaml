services:
  portainer:
    image: portainer/portainer-ce:2.33.6
    container_name: portainer
    hostname: portainer
    restart: unless-stopped
    volumes:
      # EXCEPTION: Portainer requires RW docker.sock to manage the engine
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/monarch/appdata/portainer:/data
    ports:
      - "9000:9000"
      - "9445:9443"
    networks:
      - portainer_network
    # EXCEPTION: distroless image — no shell/wget for in-container probes.
    # Validate externally: curl -fsS http://127.0.0.1:9000/api/status
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  portainer_network:
    name: portainer_network
    external: true
