services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:version-4.0.19.2979
    container_name: sonarr
    hostname: sonarr
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - proxy
      - hotio
    ports:
      # TRANSITIONAL: keep until Traefik hostname is confirmed in daily use
      - "8989:8989"
    volumes:
      - /mnt/monarch/appdata/sonarr:/config
      # Identity mounts — keep root folders + remote-path locals unchanged
      - /hive/jellyfin/tv:/hive/jellyfin/tv
      - /hive/downloads:/hive/downloads
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.sonarr.rule=Host(`sonarr.fatherfankscloud.uk`)
      - traefik.http.routers.sonarr.entrypoints=websecure
      - traefik.http.routers.sonarr.tls=true
      - traefik.http.routers.sonarr.tls.certresolver=le
      - traefik.http.services.sonarr.loadbalancer.server.port=8989
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8989/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2G

networks:
  proxy:
    external: true
  hotio:
    external: true
    name: hotio_default
