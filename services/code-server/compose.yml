services:
  code-server:
    image: lscr.io/linuxserver/code-server:latest
    container_name: code-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Etc/UTC
      PASSWORD: ${PASSWORD}
      DEFAULT_WORKSPACE: /config/workspace
      CS_TRUSTED_ORIGINS: "https://code.fatherfankscloud.uk"
    volumes:
      - /mnt/monarch/appdata/code-server:/config
      # Read-only access for Phase 8.5 repository import
      - /hive:/config/workspace/hive:ro
      - /mnt/monarch/appdata:/config/workspcae/monarch:ro
    networks:
      - proxy
      - ollama_ollama-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.code.rule=Host(`code.fatherfankscloud.uk`)"
      - "traefik.http.routers.code.entrypoints=websecure"
      - "traefik.http.routers.code.tls=true"
      - "traefik.http.routers.code.tls.certresolver=le"
      - "traefik.http.services.code.loadbalancer.server.port=8443"
      - "traefik.http.services.code.loadbalancer.server.scheme=http"
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2g

networks:
  proxy:
    external: true

  ollama_ollama-net:
    external: true
