services:
  beszel-agent:
    image: henrygd/beszel-agent:0.18.7
    container_name: beszel-agent
    restart: unless-stopped
    # EXCEPTION: host network required for host metrics (Known_Exceptions.md)
    network_mode: host
    env_file:
      - .env
    environment:
      LISTEN: ${LISTEN:-45876}
      KEY: ${KEY}
      TOKEN: ${TOKEN}
      HUB_URL: ${HUB_URL:-http://mocha:8090}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /mnt/monarch/appdata/beszel_agent/beszel_agent_data:/var/lib/beszel-agent
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
