services:
  radarr:
    image: ghcr.io/hotio/radarr:release-5.22.4.9896
    container_name: radarr
    hostname: radarr
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - proxy
      - hotio
    ports:
      # TRANSITIONAL: keep until Traefik hostname is confirmed in daily use
      - "7878:7878"
    volumes:
      - /mnt/monarch/appdata/radarr:/config
      - /hive/jellyfin/movie:/movies
      - /hive/downloads:/downloads
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.radarr.rule=Host(`radarr.fatherfankscloud.uk`)
      - traefik.http.routers.radarr.entrypoints=websecure
      - traefik.http.routers.radarr.tls=true
      - traefik.http.routers.radarr.tls.certresolver=le
      - traefik.http.services.radarr.loadbalancer.server.port=7878
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:7878/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G

networks:
  proxy:
    external: true
  hotio:
    external: true
    name: hotio_default
