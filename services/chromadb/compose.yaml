# Chroma — Semantic vector index (Phase 14.3/14.4)
# Independent Compose project. Chroma is vector index/retrieval infrastructure —
# never the Knowledge authority.
services:
  chromadb:
    image: docker.io/chromadb/chroma:latest
    container_name: kora-chromadb
    hostname: kora-chromadb
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Tokyo}
    volumes:
      - type: volume
        source: kora_chroma_data
        target: /chroma/chroma
    networks:
      - ollama-net
    labels:
      - traefik.enable=false
      - com.homelab.service=chromadb
      - com.homelab.domain=ai
      - com.homelab.phase=14.4
      - com.homelab.profile=solo
      - com.homelab.logging=central
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  # Reuse the existing Chroma data volume (created as kora_kora-chroma-data in
  # Phase 14.3) so migration to an independent project preserves all indexed
  # knowledge. Never delete this volume.
  kora_chroma_data:
    external: true
    name: kora_kora-chroma-data

networks:
  ollama-net:
    external: true
    name: ollama_ollama-net
