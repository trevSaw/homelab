services:
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped

    ports:
      - "8090:8090"

    environment:
      - APP_URL=http://mocha:8090

    volumes:
      - /mnt/monarch/appdata/beszel/beszel_data:/beszel_data

    networks:
      - homelab

networks:
  homelab:
    external: true
