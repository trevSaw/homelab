services:
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      - APP_URL=http://mocha:8090
    volumes:
      - /mnt/monarch/appdata/beszel/beszel_data:/beszel_data
    networks:
      - homelab
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  homelab:
    external: true
