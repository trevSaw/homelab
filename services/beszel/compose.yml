services:
  beszel:
    image: henrygd/beszel:0.18.7
    container_name: beszel
    hostname: beszel
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_URL: ${APP_URL:-http://mocha:8090}
    ports:
      - "8090:8090"
    volumes:
      - /mnt/monarch/appdata/beszel/beszel_data:/beszel_data
    networks:
      - homelab
    # Hub image is distroless-like; probe from host instead of CMD-SHELL wget.
    # Smoke: curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  # EXCEPTION: pre-existing monitoring network (see Known_Exceptions.md)
  homelab:
    external: true
