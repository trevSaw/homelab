# Hermes — Phase 14.1 thin execution layer (ADR-0004)
# Not KORA. Not on Solo Stage 1 primary chat path.
services:
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    hostname: hermes
    restart: unless-stopped
    command:
      - gateway
      - run
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      HERMES_DASHBOARD: ${HERMES_DASHBOARD:-1}
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-admin}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      # Stage 1: Hermes must not claim KORA identity.
      KORA_PRODUCT_NAME: KORA
      HERMES_ROLE: thin_execution_layer
      # Phase 14 Hermes migration (branch phase14-hermes-runtime).
      # OpenAI-compatible API server platform (Open WebUI entry point).
      # Default OFF to preserve the current direct KORA path. Enable at cutover.
      # Hermes refuses to start the API server without a non-empty API_SERVER_KEY.
      API_SERVER_ENABLED: ${API_SERVER_ENABLED:-false}
      API_SERVER_KEY: ${API_SERVER_KEY:-}
      API_SERVER_HOST: ${API_SERVER_HOST:-0.0.0.0}
      API_SERVER_PORT: ${API_SERVER_PORT:-8642}
      API_SERVER_MODEL_NAME: ${API_SERVER_MODEL_NAME:-KORA}
      API_SERVER_CORS_ORIGINS: ${API_SERVER_CORS_ORIGINS:-}
    volumes:
      - /mnt/monarch/appdata/hermes:/opt/data
    shm_size: 1g
    networks:
      - proxy
      - ollama-net
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.hermes.rule=Host(`hermes.fatherfankscloud.uk`)
      - traefik.http.routers.hermes.entrypoints=websecure
      - traefik.http.routers.hermes.tls=true
      - traefik.http.routers.hermes.tls.certresolver=le
      - traefik.http.services.hermes.loadbalancer.server.port=9119
      - com.homelab.service=hermes
      - com.homelab.domain=ai
      - com.homelab.phase=14.2-preflight
      - com.homelab.role=thin-execution-layer
      - com.homelab.logging=central
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9119/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    logging:
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G

networks:
  proxy:
    external: true
  ollama-net:
    external: true
    name: ollama_ollama-net
