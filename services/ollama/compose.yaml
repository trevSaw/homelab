# Ollama — Phase 14.1/14.2 governance SoT (inference only)
# Models preserved at /hive/ollama (production data bind — do not relocate).
# Compose ownership: services/ollama (NOT /hive/ollama).
# CRITICAL: ollama_ollama-net is external — never delete this network.
services:
  ollama:
    image: ollama/ollama:0.30.10
    container_name: ollama
    hostname: ollama
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:-q8_0}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-2048}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY}
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:--1}
    volumes:
      - /hive/ollama:/root/.ollama
    networks:
      - ollama-net
      - ai-assistant
    labels:
      - traefik.enable=false
      - com.homelab.service=ollama
      - com.homelab.domain=ai
      - com.homelab.phase=14.2-preflight
      - com.homelab.logging=central
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      options:
        max-size: "10m"
        max-file: "5"
    shm_size: "4gb"
    deploy:
      resources:
      #  reservations:
       #   devices:
        #    - driver: nvidia
         #     count: all
          #    capabilities: [gpu]
        limits:
          cpus: "12.0"
          memory: 48G

networks:
  # EXTERNAL — shared by kora, open-webui, hermes, honcho, code-server, odysseus.
  # Must never be removed by compose down.
  ollama-net:
    external: true
    name: ollama_ollama-net
  ai-assistant:
    external: true
