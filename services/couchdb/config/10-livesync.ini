# CouchDB native CORS — Obsidian Self-hosted LiveSync clients.
# Origins are the documented LiveSync client origins:
#   app://obsidian.md      Obsidian Desktop (Electron)
#   capacitor://localhost  Obsidian Mobile (iOS, Capacitor)
#   http://localhost       Obsidian Mobile (Android, Capacitor)
# CouchDB reflects the single matching Origin (valid CORS) and handles
# OPTIONS preflight natively. If a client uses extra custom headers in the
# LiveSync "database connection advanced settings", add them here.
[chttpd]
enable_cors = true

[cors]
origins = app://obsidian.md,capacitor://localhost,http://localhost
credentials = true
methods = GET, PUT, POST, HEAD, DELETE
headers = accept, authorization, content-type, origin, referer
max_age = 3600
