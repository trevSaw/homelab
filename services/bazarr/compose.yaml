name: bazarr
services:
  bazarr:
    image: linuxserver/bazarr:1.2.2
    container_name: bazarr
    hostname: bazarr
    restart: unless-stopped
    environment:
      - PGID=1000
      - PUID=1000
      - TZ=Europe/London
    volumes:
      - /DATA/AppData/bazarr/config:/config
      - /hive/jellyfin/movie:/movies
      - /hive/jellyfin/tv:/tv
    ports:
      - "6767:6767"
    networks:
      - hotio_default
    deploy:
      resources:
        limits:
          memory: 8429M

networks:
  hotio_default:
    external: true
    name: hotio_default
