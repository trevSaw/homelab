services:
  jellyfin:
    image: ghcr.io/hotio/jellyfin:release-12.1
    container_name: jellyfin
    restart: unless-stopped
    # EXCEPTION: NVIDIA runtime required for NVENC/NVDEC (T400) hardware transcoding
    runtime: nvidia
    env_file:
      - .env
    environment:
      NVIDIA_DRIVER_CAPABILITIES: all
      NVIDIA_VISIBLE_DEVICES: all
    # EXCEPTION: NVIDIA CUDA devices for hardware transcoding
    gpus: all
    devices:
      - /dev/dri:/dev/dri
    networks:
      - proxy
    ports:
      # TRANSITIONAL: LAN clients / local bookmarks; Traefik is preferred ingress
      - "8096:8096"
    volumes:
      - /mnt/monarch/appdata/jellyfin:/config
      # Abyss theme: hotio runs /etc/s6-overlay/init-hook-app at startup (equiv. of linuxserver custom-cont-init.d)
      - /mnt/monarch/appdata/jellyfin/init-hook-app:/etc/s6-overlay/init-hook-app
      - /hive/jellyfin/tv:/data/tvshows
      - /hive/jellyfin/movie:/data/movies
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.jellyfin.rule=Host(`jellyfin.fatherfankscloud.uk`)
      - traefik.http.routers.jellyfin.entrypoints=websecure
      - traefik.http.routers.jellyfin.tls=true
      - traefik.http.routers.jellyfin.tls.certresolver=le
      - traefik.http.services.jellyfin.loadbalancer.server.port=8096
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8096/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      # 12.x first-boot DB migration can take several minutes
      start_period: 300s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 4G

networks:
  proxy:
    external: true
