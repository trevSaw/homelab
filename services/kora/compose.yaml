# KORA Runtime — Phase 14.4 Knowledge Graph
# Path: User → Open WebUI → KORA → Knowledge (Chroma + Graphify) → Ollama
services:
  kora:
    build:
      context: ../../AI/KORA
      dockerfile: Runtime/Dockerfile
    image: homelab/kora-runtime:14.5.0
    container_name: kora
    hostname: kora
    restart: unless-stopped
    # Startup order (documented): ollama → kora → open-webui.
    # ollama is a separate compose project; do not depends_on across projects.
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      KORA_DEFAULT_MODEL: ${KORA_DEFAULT_MODEL:-qwen3:8b}
      KORA_LOG_LEVEL: ${KORA_LOG_LEVEL:-INFO}
      KORA_CONFIG_DIR: /config
      KORA_PROMPTS_DIR: /prompts
      KORA_MEMORY_DB_PATH: ${KORA_MEMORY_DB_PATH:-/data/memory-runtime.sqlite3}
      KORA_EMBEDDING_MODEL: ${KORA_EMBEDDING_MODEL:-nomic-embed-text}
      KORA_CHROMA_BASE_URL: ${KORA_CHROMA_BASE_URL:-http://chromadb:8000}
      KORA_CHROMA_COLLECTION: ${KORA_CHROMA_COLLECTION:-kora_knowledge}
      KORA_INDEX_METADATA_DB_PATH: ${KORA_INDEX_METADATA_DB_PATH:-/data/knowledge-index.sqlite3}
      KORA_GRAPH_ENABLED: ${KORA_GRAPH_ENABLED:-true}
      KORA_GRAPH_PROVIDER: ${KORA_GRAPH_PROVIDER:-graphify}
      KORA_GRAPH_STORE_DB_PATH: ${KORA_GRAPH_STORE_DB_PATH:-/data/knowledge-graph.sqlite3}
      KORA_GRAPHIFY_BASE_URL: ${KORA_GRAPHIFY_BASE_URL:-http://graphify:8080}
      KORA_GRAPHIFY_API_KEY: ${KORA_GRAPHIFY_API_KEY:-}
      KORA_GRAPH_EXPORT_PATH: ${KORA_GRAPH_EXPORT_PATH:-/data/graph.json}
      KORA_TOOLS_ENABLED: ${KORA_TOOLS_ENABLED:-true}
    volumes:
      - ../../AI/KORA/Config:/config:ro
      - ../../AI/KORA/Prompts:/prompts:ro
      - /mnt/monarch/appdata/kora:/data
    networks:
      - ollama-net
      - proxy
    labels:
      - traefik.enable=false
      - com.homelab.service=kora
      - com.homelab.domain=ai
      - com.homelab.phase=14.5
      - com.homelab.profile=solo
      - com.homelab.logging=central
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s
    logging:
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

networks:
  ollama-net:
    external: true
    name: ollama_ollama-net
  proxy:
    external: true
