name: hotio
services:
  qbittorrent:
    image: ghcr.io/hotio/qbittorrent:release-4.5.5
    container_name: qbittorrent
    hostname: qbittorrent
    restart: unless-stopped
    env_file:
      - .env
    cap_add:
      # EXCEPTION: WireGuard VPN inside container (see Known_Exceptions.md)
      - NET_ADMIN
    sysctls:
      net.ipv4.conf.all.src_valid_mark: "1"
      net.ipv6.conf.all.disable_ipv6: "1"
    ports:
      - "8080:8080"   # qBittorrent WebUI
      - "8118:8118"   # Privoxy
      - "6789:6789"   # NZBGet (shared netns via network_mode on nzbget)
    volumes:
      - /mnt/monarch/appdata/hotio:/config
      - /hive/downloads/completed:/downloads
    # WebUI after VPN bring-up; start_period accounts for WG handshake
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 8G

networks:
  default:
    name: hotio_default
