services:
  postgresql:
    image: postgres:16-alpine
    container_name: authentik-db
    restart: unless-stopped

    env_file:
      - ../.env

    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_DB: ${PG_DB}
      POSTGRES_PASSWORD: ${PG_PASS}

    volumes:
      - ${PATH_DATA}/authentik/db:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 30s
      retries: 5
    networks:
      - authentik

  redis:
    image: redis:alpine
    container_name: authentik-redis
    restart: unless-stopped

    volumes:
      - ${PATH_DATA}/authentik/redis:/data

    command: --save 60 1 --loglevel warning

    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 30s
      retries: 5
    networks:
      - authentik

  server:
    image: ghcr.io/goauthentik/server:2024.12.3
    container_name: authentik-server
    restart: unless-stopped
    command: server

    env_file:
      - ../.env

    environment:
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER}
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_SECRET_KEY: aNDBXIRFsw+v+bjyfota3Ns7dsoXoDVdKqtAj51pjFByp4cieEx6yiXRNLhDXOxd

      AUTHENTIK_DISABLE_STARTUP_ANALYTICS: "true"
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"

    volumes:
      - ${PATH_DATA}/authentik/media:/media
      - ${PATH_DATA}/authentik/templates:/templates

    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      - "traefik.http.routers.authentik.rule=Host(`sso.${DEFAULT_DOMAIN}`)"
      - "traefik.http.routers.authentik.entrypoints=websecure"
      - "traefik.http.routers.authentik.tls=true"

      - "traefik.http.services.authentik.loadbalancer.server.port=9000"

    networks:
      - authentik
      - proxy

  worker:
    image: ghcr.io/goauthentik/server:2024.12.3
    container_name: authentik-worker
    restart: unless-stopped
    command: worker
    user: root

    env_file:
      - ../.env

    environment:
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER}
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_SECRET_KEY: aNDBXIRFsw+v+bjyfota3Ns7dsoXoDVdKqtAj51pjFByp4cieEx6yiXRNLhDXOxd
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PATH_DATA}/authentik/media:/media
      - ${PATH_DATA}/authentik/templates:/templates
      - ${PATH_DATA}/authentik/certs:/certs

    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - authentik
      - proxy

networks:
  proxy:
    external: true
  authentik:
    driver: bridge

