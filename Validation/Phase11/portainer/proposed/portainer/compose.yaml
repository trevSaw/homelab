services:
  portainer:
    container_name: portainer
    image: portainer/portainer-ce:lts
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/monarch/appdata/portainer:/data
    ports:
      - 9000:9000
      - 9445:9443
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/api/status >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  default:
    name: portainer_network
