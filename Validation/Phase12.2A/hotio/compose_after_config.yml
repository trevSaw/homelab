name: hotio
services:
  qbittorrent:
    cap_add:
      - NET_ADMIN
    container_name: qbittorrent
    deploy:
      resources:
        limits:
          memory: "8589934592"
    environment:
      PGID: "1000"
      PRIVOXY_ENABLED: "true"
      PUID: "1000"
      TZ: Etc/UTC
      UMASK: "002"
      VPN_ADDITIONAL_PORTS: 6789/tcp,6789/udp
      VPN_CONF: wg0
      VPN_ENABLED: "true"
      VPN_IP_CHECK_DELAY: "10"
      VPN_IP_CHECK_EXIT: "true"
      VPN_LAN_NETWOK: 192.168.0.0/24
      WEBUI_PORTS: 8080/tcp,8080/udp
    hostname: qbittorrent
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS -o /dev/null http://127.0.0.1:8080/ || exit 1
      timeout: 10s
      interval: 30s
      retries: 5
      start_period: 1m30s
    image: ghcr.io/hotio/qbittorrent:release-4.5.5
    logging:
      options:
        max-file: "3"
        max-size: 10m
    networks:
      default: null
    ports:
      - mode: ingress
        target: 8080
        published: "8080"
        protocol: tcp
      - mode: ingress
        target: 8118
        published: "8118"
        protocol: tcp
      - mode: ingress
        target: 6789
        published: "6789"
        protocol: tcp
    restart: unless-stopped
    sysctls:
      net.ipv4.conf.all.src_valid_mark: "1"
      net.ipv6.conf.all.disable_ipv6: "1"
    volumes:
      - type: bind
        source: /mnt/monarch/appdata/hotio
        target: /config
        bind: {}
      - type: bind
        source: /hive/downloads/completed
        target: /downloads
        bind: {}
networks:
  default:
    name: hotio_default
