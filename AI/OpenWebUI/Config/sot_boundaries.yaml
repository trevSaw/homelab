# Open WebUI ↔ KORA Source-of-Truth boundaries (Phase 14 final)
# ADR-0008: Open WebUI is UI only. It is not the KORA agent, Memory, or Knowledge.

open_webui:
  role: conversational_ui
  product_identity: KORA  # branding only
  durable_authority: false

allowed_storage:
  - path: /mnt/monarch/appdata/open-webui
    mount: /app/backend/data
    contents:
      - webui.db          # UI sessions/chats/users
      - vector_db         # Open WebUI built-in RAG index (UI-local)
      - uploads           # UI uploads
      - cache             # embeddings/whisper/tiktoken caches
    classification: application_runtime_data
    kora_sot: false

forbidden_mounts_for_open_webui:
  - /mnt/monarch/appdata/honcho   # KORA memory SoT — Hermes/Honcho only
  - /mnt/monarch/appdata/kora     # retired KORA runtime data; not UI RAG
  - /hive/ollama                  # model store; inference only via KORA→Ollama

kora_sot_paths:
  memory: Honcho (Hermes native honcho provider, workspace "kora", peer "user")
  knowledge: Chroma (kora-chromadb)
  relationships: Graphify
  architecture_docs: Architecture/ai/

rules:
  - Open WebUI built-in RAG/memory/embeddings must never be treated as KORA Memory or Knowledge.
  - No automatic writes from Open WebUI into KORA-controlled knowledge/memory stores.
  - Durable Memory flows through the Hermes native Honcho provider (KORA head agent).
  - Operators must not symlink or bind-mount UI vector_db into KORA SoT trees.

recommended_operator_posture:
  - Prefer chat via Hermes api_server (model "KORA") — already configured.
  - Avoid enabling Open WebUI features that present UI RAG as platform knowledge.
  - Do not configure Open WebUI document collections as the homelab standards corpus.
