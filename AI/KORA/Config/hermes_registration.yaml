# Hermes registration — Phase 14 final
# KORA is a Hermes Agent. Hermes is the generic runtime; KORA is the head agent.

substrate: hermes
status: active_head_agent
adr: ADR-0004

role: kora_head_agent
is_kora: true
replaces_council: true
owns_product_identity: true

final_architecture:
  primary_chat_path: Open WebUI -> Hermes -> KORA -> Ollama
  memory: Honcho (Hermes native honcho provider; workspace "kora", peer "user")
  knowledge: Chroma (kora-chromadb)
  relationships: Graphify
  inference: Ollama
  tools: MCP

interfaces:
  required:
    - hermes_api_server            # Open WebUI entry (port 8642, model "KORA")
    - honcho_provider              # native memory provider
  retired:
    - kora_runtime_api_server      # old standalone runtime (retired)

health:
  expect_reachable: true
  expect_on_primary_chat_path: true
