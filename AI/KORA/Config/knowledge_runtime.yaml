# Phase 14.3/14.4 — Knowledge Platform configuration
# KORA owns what Knowledge means and how Knowledge is used.
# Chroma is a semantic index; Graphify is a relationship graph; neither is the
# Knowledge authority.

embedding:
  provider: ollama
  model: nomic-embed-text
  base_url: http://ollama:11434
  timeout_seconds: 60
  retry_attempts: 2
  retry_base_seconds: 0.2

vector:
  provider: chroma
  base_url: http://chromadb:8000
  collection: kora_knowledge
  timeout_seconds: 30
  retry_attempts: 2

chunking:
  size: 512
  overlap: 64

indexing:
  enabled: true
  replace_on_success: true
  metadata_sqlite_enabled: true
  metadata_db_path: /data/knowledge-index.sqlite3

retrieval:
  enabled: true
  top_k: 5

events:
  indexing_topics:
    - knowledge.ingestion.file

graph:
  enabled: true
  provider: local          # local (KORA-owned SQLite) | graphify (Graphify MCP server)
  store_sqlite_enabled: true
  store_db_path: /data/knowledge-graph.sqlite3
  graphify_base_url: http://graphify:8080
  graphify_api_key: ""
  graphify_timeout_seconds: 30
  graphify_retry_attempts: 2
  export_path: /data/graph.json
  event_topics:
    - knowledge.ingestion.file
