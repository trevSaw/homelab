# Phase 14.5 — Tool Platform configuration
# KORA owns tool discovery, authorization, and execution.
# Discovery != Authorization: discovered tools are disabled until explicitly
# enabled. Consequential tools require explicit risk classification and approval.

enabled: true
read_only_automatic: true
default_timeout_seconds: 15

# Explicitly configured, safe, read-only tools.
tools:
  - name: ollama.list_models
    provider: ollama
    risk: read_only
    enabled: true
    description: "List models available in the local Ollama instance"
  - name: ollama.list_running
    provider: ollama
    risk: read_only
    enabled: true
    description: "List currently running Ollama models"

# MCP servers are explicitly configured. A discovered MCP tool is NOT
# automatically authorized. No arbitrary endpoints are trusted.
mcp_servers: []
